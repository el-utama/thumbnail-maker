<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thumbnail Lab — eL Utama</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">▶</span>
    <div>
      <strong>Thumbnail Lab</strong>
      <span class="tag">eL Utama preset</span>
    </div>
  </div>
  <div class="top-actions">
    <span class="status" id="status">ready</span>
    <select id="examples" class="select" aria-label="Load example">
      <option value="">Examples…</option>
      <option value="dashboard">Dashboard Light · Night Drive</option>
      <option value="quiet">Quiet Indie Folk · Rainy</option>
    </select>
    <button class="ghost" id="btnDemo">Demo art</button>
    <button class="ghost" id="btnReset">Reset copy</button>
  </div>
</header>

<main class="layout">

  <!-- LEFT: inputs -->
  <aside class="panel panel-left">
    <section class="block">
      <h2>Artwork <span class="hint">Flow render, 16:9</span></h2>
      <label class="drop" id="drop" for="fileInput">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <span class="drop-icon">＋</span>
        <span class="drop-title">Drop an image</span>
        <span class="drop-sub">PNG · JPG · or click to browse</span>
      </label>
      <div class="row">
        <button class="ghost small" id="btnClearArt">Clear image</button>
        <span class="hint" id="fileName">no image loaded</span>
      </div>
    </section>

    <section class="block">
      <h2>Copy</h2>
      <label class="field">
        <span>Hook / title</span>
        <textarea id="title" rows="2" spellcheck="false"></textarea>
        <em>Use <b>|</b> to force a line break. 2–4 words converts best.</em>
      </label>
      <label class="field">
        <span>Accent word</span>
        <input id="accent" type="text" spellcheck="false" />
      </label>
      <label class="field">
        <span>Kicker</span>
        <input id="subtitle" type="text" spellcheck="false" />
      </label>
      <div class="grid2">
        <label class="field">
          <span>Genre chip</span>
          <input id="genre" type="text" spellcheck="false" />
        </label>
        <label class="field">
          <span>Badge</span>
          <input id="badge" type="text" spellcheck="false" />
        </label>
      </div>
      <label class="field">
        <span>Channel</span>
        <input id="channel" type="text" spellcheck="false" />
      </label>
    </section>

    <section class="block">
      <h2>Fit</h2>
      <label class="switch">
        <input type="checkbox" id="autoPlace" checked />
        <span>Auto text side</span>
        <em>keeps type off the busy half</em>
      </label>
      <label class="slider">
        <span>Size <output id="outScale">1.00</output></span>
        <input type="range" id="scale" min="0.7" max="1.45" step="0.01" value="1" />
      </label>
      <label class="slider">
        <span>Nudge X <output id="outX">0</output></span>
        <input type="range" id="offsetX" min="-0.15" max="0.15" step="0.005" value="0" />
      </label>
      <label class="slider">
        <span>Nudge Y <output id="outY">0</output></span>
        <input type="range" id="offsetY" min="-0.2" max="0.2" step="0.005" value="0" />
      </label>
      <label class="slider">
        <span>Scrim <output id="outScrim">1.00</output></span>
        <input type="range" id="scrim" min="0" max="1.3" step="0.01" value="1" />
      </label>
      <label class="slider">
        <span>Grain <output id="outGrain">0.45</output></span>
        <input type="range" id="grain" min="0" max="1" step="0.01" value="0.45" />
      </label>
    </section>
  </aside>

  <!-- CENTER: canvas -->
  <section class="stage">
    <div class="stage-head">
      <div class="seg" id="viewSeg">
        <button data-view="full" class="on">1280 × 720</button>
        <button data-view="feed">Feed size</button>
      </div>
      <span class="stage-meta" id="stageMeta">night-drive · cinematic</span>
    </div>

    <div class="canvas-shell" id="canvasShell">
      <canvas id="stage" width="1280" height="720"></canvas>
    </div>

    <div class="stage-foot">
      <div class="rail-test">
        <canvas id="mini" width="120" height="68"></canvas>
        <div>
          <strong>Mobile rail test</strong>
          <span>Can you read the hook at 120 px?</span>
        </div>
      </div>
      <ul class="checks" id="checks"></ul>
    </div>
  </section>

  <!-- RIGHT: templates, themes, export -->
  <aside class="panel panel-right">
    <section class="block">
      <h2>Templates</h2>
      <div class="template-grid" id="templates"></div>
    </section>

    <section class="block">
      <h2>Themes</h2>
      <div class="theme-row" id="themes"></div>
    </section>

    <section class="block">
      <h2>Export</h2>
      <div class="row">
        <button class="primary" id="btnPng">PNG</button>
        <button class="ghost" id="btnJpg">JPG</button>
      </div>
      <button class="wide" id="btnAbc">Download A/B/C themes</button>
      <p class="hint">A/B/C keeps the layout and swaps palette — good for testing CTR.</p>
    </section>
  </aside>
</main>

<script src="js/presets.js"></script>
<script src="js/renderer.js"></script>
<script src="js/zip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
